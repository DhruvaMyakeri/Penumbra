[project]
name = "penumbra"
version = "0.1.0"
description = "Visual fault injection and robustness discovery for physical-AI policies"
requires-python = ">=3.10"
dependencies = [
  "reactor-sdk>=1.1.0",
  "python-dotenv",
  "numpy",
  "opencv-python",
  "pyarrow",
  "pandas",
  "huggingface_hub",
  "av",
  "pyyaml",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
